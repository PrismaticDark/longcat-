# ==============================================================================
# LongCat Sentinel v2.3.1 Security Hardened Edition 配置文件
# 专为美团万亿 MoE 大模型 LongCat-2.5-Preview 深度适配的智能熔断与抗死循环网关
#
# 安全凭证一律通过环境变量注入，配置文件中严禁出现任何明文或默认值：
#   SENTINEL_GATEWAY_TOKEN / SENTINEL_ADMIN_TOKEN / LONGCAT_API_KEY
# ==============================================================================

server:
  host: "127.0.0.1"                     # 非 127.0.0.1 必须配置 TLS，否则拒绝启动
  port: 8080                            # 设为 0 支持动态高位随机端口自适应
  workers: 1
  tls_enabled: false                    # 开启后必须配置有效证书路径
  tls_cert_path: ""
  tls_key_path: ""

auth:
  # 强制环境变量插值：没有默认值，缺失即拒绝启动
  gateway_tokens:
    - "${SENTINEL_GATEWAY_TOKEN}"
  dashboard_admin_token: "${SENTINEL_ADMIN_TOKEN:-}"

upstream:
  # 美团官方生产集群地址
  base_url: "https://api.longcat.chat"
  api_key: "${LONGCAT_API_KEY}"
  upstream_timeout_seconds: 180
  default_model: "LongCat-2.5-Preview"

timeouts:
  time_to_first_token_seconds: 90       # TTFT 独立超时，应对 1M 上下文 Prefill 延迟
  stream_idle_seconds: 30               # 首字吐出后相邻 Chunk 空闲间隔超时

limits:
  max_request_body_bytes: 10485760      # 10MB 请求体上限（超限返回 413）
  ring_buffer_bytes: 2097152            # 2MB 环形滑动窗口
  max_active_streams: 64                # 并发流上限（超限返回 429）

security:
  # 作用域明确：仅作用于日志记录、终端大屏与监控指标，绝不篡改业务数据流
  deep_redaction_scope: "logs_and_metrics_only"
  enable_api_docs: false                # 生产默认关闭 /docs 与 /openapi.json
  allowed_loopback_regex: "^https?://(?:127\\.0\\.0\\.1|localhost|\\[::1\\])(?::\\d+)?$"
  allowed_origins: []                   # 仅当需要浏览器跨域访问时才填写具体来源
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "[::1]"

breaker:
  active_profile: "code_agent"
  streaming_action: "protocol_compliant_inject"
  injection_template: >-
    


    [LongCat Sentinel 保护性中断] ⚠️ 检测到输出内容/思考链陷入高频周期循环或触发高危拦截（原因：{reason}）。
    网关已保护性截断以节约 Token。请 Agent 检查当前解决思路，更换工具或尝试其他解决方案。

tool_guard:
  enable_argument_intent_scan: true
  block_destructive_patterns: true
  action_on_destructive: "block_and_freeze"

profiles:
  # 1. 自适应敏捷早停模式（默认推荐：长段落/自白快速识别，防误杀调优）
  code_agent:
    min_period_chars: 16                # 最小周期长度（低于此长度的代码缩进、标点被免疫过滤）
    repeat_threshold: 4                 # 连续重复出现次数阈值（保持 4 防止代码缩进误杀）
    window_chars: 4000                  # 滑动监控字符窗口大小
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.85        # 模糊相似度阈值 (0.0 ~ 1.0)
    fuzzy_repeat_threshold: 4
    max_period_chars: 2000              # 宏观长周期检测上限（消除 200 字符盲区）
    block_loop_enabled: true            # 开启段落/大块代码级语义哈希循环检测
    block_repeat_threshold: 3           # 相同语义大块复现 3 次判定循环（调优至 3 防代码模板误杀）
    min_block_chars: 30                 # 语义块最小字符数
    self_loop_heuristics_enabled: true  # 开启思考链反刍/自白死循环识别 (如 stop this loop)
    self_loop_threshold: 3              # 自白死循环特征词出现 3 次即刻熔断
    tool_loop_enabled: true
    max_duplicate_tool_calls: 3         # 相同工具且相同参数的最大连续调用次数
    tool_cycle_window: 8                # 检测 A->B->A->B 乒乓循环的滑动窗口深度
    tool_skeleton_enabled: true         # 开启命令骨架泛化（识别微调搜索后缀与管道的同义空转）
    max_duplicate_skeleton_calls: 3     # 同义命令骨架调用阈值（设为 3 防误杀）
    think_loop_enabled: true
    max_think_chars: 32000              # 思考链最大保护字符数（充分保障万亿 MoE 深度推理不被误杀）
    longcat_reasoning_guard_enabled: true # 美团 LongCat 递归思考与元反思震荡守卫 (1:1 专属特化)
    longcat_plan_churn_threshold: 3       # 计划推倒重拟阈值 (3 次未执行即熔断)
    longcat_second_guessing_threshold: 3  # 自我怀疑推翻打断阈值
    longcat_constraint_threshold: 5       # 冲突约束偏执咀嚼阈值
    longcat_min_reasoning_chars: 6000     # 思考链累积最小激活门槛 (低于 6000 字符 100% 豁免放行)
    longcat_memory_search_threshold: 8    # 脑内虚构检索/知识反刍阈值
    longcat_hesitation_threshold: 8       # 犹疑打断协同阈值 (与记忆检索复合)
    longcat_standalone_hesitation_threshold: 10 # 独立犹疑单边信号打断阈值

  # 2. 极度激进模式（极致 Token 节约，秒级掐断死循环）
  ultra_aggressive:
    min_period_chars: 12
    repeat_threshold: 2
    window_chars: 3000
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.80
    fuzzy_repeat_threshold: 2
    max_period_chars: 2000
    block_loop_enabled: true
    block_repeat_threshold: 2
    min_block_chars: 20
    self_loop_heuristics_enabled: true
    self_loop_threshold: 2
    tool_loop_enabled: true
    max_duplicate_tool_calls: 2
    tool_cycle_window: 6
    tool_skeleton_enabled: true
    max_duplicate_skeleton_calls: 2
    think_loop_enabled: true
    max_think_chars: 16000
    longcat_reasoning_guard_enabled: true
    longcat_plan_churn_threshold: 2
    longcat_second_guessing_threshold: 2
    longcat_constraint_threshold: 4
    longcat_min_reasoning_chars: 3000

  # 3. 严格抗循环模式
  strict:
    min_period_chars: 12
    repeat_threshold: 3
    window_chars: 3000
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.80
    fuzzy_repeat_threshold: 3
    max_period_chars: 2000
    block_loop_enabled: true
    block_repeat_threshold: 2
    min_block_chars: 25
    self_loop_heuristics_enabled: true
    self_loop_threshold: 3
    tool_loop_enabled: true
    max_duplicate_tool_calls: 2
    tool_cycle_window: 6
    tool_skeleton_enabled: true
    max_duplicate_skeleton_calls: 2
    think_loop_enabled: true
    max_think_chars: 24000
    longcat_reasoning_guard_enabled: true
    longcat_plan_churn_threshold: 3
    longcat_second_guessing_threshold: 3
    longcat_constraint_threshold: 5
    longcat_min_reasoning_chars: 3500

  # 4. 平衡模式
  balanced:
    min_period_chars: 14
    repeat_threshold: 3
    window_chars: 3500
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.82
    fuzzy_repeat_threshold: 3
    max_period_chars: 2000
    block_loop_enabled: true
    block_repeat_threshold: 3
    min_block_chars: 25
    self_loop_heuristics_enabled: true
    self_loop_threshold: 3
    tool_loop_enabled: true
    max_duplicate_tool_calls: 3
    tool_cycle_window: 8
    tool_skeleton_enabled: true
    max_duplicate_skeleton_calls: 3
    think_loop_enabled: true
    max_think_chars: 32000
    longcat_reasoning_guard_enabled: true
    longcat_plan_churn_threshold: 3
    longcat_second_guessing_threshold: 4
    longcat_constraint_threshold: 6
    longcat_min_reasoning_chars: 4000

immunity:
  ignore_whitespaces: true
  ignore_markdown_separators: true       # 忽略 '---', '===', '***' 等分隔符
  code_block_multiplier: 1.5            # 在代码块内部自动放宽 1.5 倍阈值，保护大段模板代码
