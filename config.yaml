# ==============================================================================
# LongCat Sentinel v2.3.1 Security Hardened Edition 配置文件
# 专为美团万亿 MoE 大模型 LongCat-2.5-Preview 深度适配的智能熔断与抗死循环网关
#
# 安全凭证一律通过环境变量注入，配置文件中严禁出现任何明文或默认值：
#   SENTINEL_GATEWAY_TOKEN / SENTINEL_ADMIN_TOKEN / LONGCAT_API_KEY
# ==============================================================================

server:
  host: "127.0.0.1"                     # 非 127.0.0.1 必须配置 TLS，否则拒绝启动
  port: 8080                            # 设为 0 支持动态高位随机端口自适应
  workers: 1
  tls_enabled: false                    # 开启后必须配置有效证书路径
  tls_cert_path: ""
  tls_key_path: ""

auth:
  # 强制环境变量插值：没有默认值，缺失即拒绝启动
  gateway_tokens:
    - "${SENTINEL_GATEWAY_TOKEN}"
  dashboard_admin_token: "${SENTINEL_ADMIN_TOKEN:-}"

upstream:
  # 美团官方生产集群地址
  base_url: "https://api.longcat.chat"
  api_key: "${LONGCAT_API_KEY}"
  upstream_timeout_seconds: 180
  default_model: "LongCat-2.5-Preview"

timeouts:
  time_to_first_token_seconds: 90       # TTFT 独立超时，应对 1M 上下文 Prefill 延迟
  stream_idle_seconds: 30               # 首字吐出后相邻 Chunk 空闲间隔超时

limits:
  max_request_body_bytes: 10485760      # 10MB 请求体上限（超限返回 413）
  ring_buffer_bytes: 2097152            # 2MB 环形滑动窗口
  max_active_streams: 64                # 并发流上限（超限返回 429）

security:
  # 作用域明确：仅作用于日志记录、终端大屏与监控指标，绝不篡改业务数据流
  deep_redaction_scope: "logs_and_metrics_only"
  enable_api_docs: false                # 生产默认关闭 /docs 与 /openapi.json
  allowed_loopback_regex: "^https?://(?:127\\.0\\.0\\.1|localhost|\\[::1\\])(?::\\d+)?$"
  allowed_origins: []                   # 仅当需要浏览器跨域访问时才填写具体来源
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "[::1]"

breaker:
  active_profile: "code_agent"
  streaming_action: "protocol_compliant_inject"
  injection_template: >-
    


    [LongCat Sentinel 保护性中断] ⚠️ 检测到输出内容/思考链陷入高频周期循环或触发高危拦截（原因：{reason}）。
    网关已保护性截断以节约 Token。请 Agent 检查当前解决思路，更换工具或尝试其他解决方案。

tool_guard:
  enable_argument_intent_scan: true
  block_destructive_patterns: true
  action_on_destructive: "block_and_freeze"

profiles:
  # 1. 代码生成与 Agent 推荐模式（防误杀调优）
  code_agent:
    min_period_chars: 16                # 最小周期长度（低于此长度的代码缩进、标点被免疫过滤）
    repeat_threshold: 4                 # 连续重复出现次数阈值
    window_chars: 4000                  # 滑动监控字符窗口大小
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.85        # 模糊相似度阈值 (0.0 ~ 1.0)
    fuzzy_repeat_threshold: 4
    tool_loop_enabled: true
    max_duplicate_tool_calls: 3         # 相同工具且相同参数的最大连续调用次数
    tool_cycle_window: 8                # 检测 A->B->A->B 乒乓循环的滑动窗口深度
    think_loop_enabled: true
    max_think_chars: 16000              # 思考链最大保护字符数

  # 2. 严格抗循环模式
  strict:
    min_period_chars: 12
    repeat_threshold: 3
    window_chars: 3000
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.80
    fuzzy_repeat_threshold: 3
    tool_loop_enabled: true
    max_duplicate_tool_calls: 2
    tool_cycle_window: 6
    think_loop_enabled: true
    max_think_chars: 10000

  # 3. 平衡模式
  balanced:
    min_period_chars: 14
    repeat_threshold: 3
    window_chars: 3500
    fuzzy_enabled: true
    fuzzy_similarity_ratio: 0.82
    fuzzy_repeat_threshold: 3
    tool_loop_enabled: true
    max_duplicate_tool_calls: 3
    tool_cycle_window: 8
    think_loop_enabled: true
    max_think_chars: 12000

immunity:
  ignore_whitespaces: true
  ignore_markdown_separators: true       # 忽略 '---', '===', '***' 等分隔符
  code_block_multiplier: 1.5            # 在代码块内部自动放宽 1.5 倍阈值，保护大段模板代码
